###########################################################
# CNN1 - Serifi spatial-gradient test experiment
###########################################################

general:
  verbose: true
  experiment: "cnn1_temperature_serifi_gradient_test"
  variable: "temp"
  target: "lmdz35"
  src: "lmdz250"
  model_type: "cnn1"
  interpolation_type: "linear"
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850, 1000]
  resolution: 2.0

training:
  learning_rate: 1e-3
  epochs: 20
  batch_size: 4
  loss_type: "serifi_gradient"
  norm_mode: "gridbox"
  serifi:
    gradient_weight: 1.0
  early_stopping:
    enable: true
    max: 15
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adam"
  dropout:
    enable: true
    value: 0.1
  scheduler:
    enable: false
    type: "cosine"
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: false
    percentage: 0.1

cnn:
  mode: "cnn1"

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 36

dates:
  train:
    start: "1980-01-01"
    end: "1984-12-31"
  test:
    start: "1985-01-01"
    end: "1985-12-31"

paths:
  # Paths for Mohammad's environment
  root_dir: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/models/lmdz/r250"
  results_dir: "/srv/data/mohammad.elaabaribao/work/interns/y2026/temp/ds_temp_intern/temp/era5_mswt/main/../../lmdz250_to_lmdz35/main/results/phy_ai/cnn1_serifi_gradient_test"
  shapefile_path: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp"
  lmdz_predictor_pattern: "{lmdz_var}-hist.nc"
  lmdz35_path: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/models/lmdz/r35/temp-hist.nc"

