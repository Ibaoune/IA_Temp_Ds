###########################################################
# CNN10 - Xiong spatial-continuity test experiment
###########################################################

general:
  verbose: true
  experiment: "cnn10_temperature_xiong_continuity_test"
  variable: "temp"
  target: "mswt"
  src: "era5"
  model_type: "cnn10"
  interpolation_type: "linear"
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850, 1000]
  resolution: 2.0

training:
  learning_rate: 1e-3
  epochs: 20
  batch_size: 4
  loss_type: "xiong_continuity"
  norm_mode: "gridbox"
  xiong:
    continuity_weight: 1.0e-4
    directional_weight: 1.0e-4
    eps: 1.0e-8
  early_stopping:
    enable: true
    max: 15
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adam"
  dropout:
    enable: true
    value: 0.1
  scheduler:
    enable: false
    type: "cosine"
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: false
    percentage: 0.1

cnn:
  mode: "cnn10"

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 36

dates:
  train:
    start: "1980-01-01"
    end: "1984-12-31"
  test:
    start: "1985-01-01"
    end: "1985-12-31"

