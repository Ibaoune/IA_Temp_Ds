###########################################################
# CNN10 - Xiong directional-consistency experiment
###########################################################

general:
  verbose: true
  experiment: "cnn10_temperature_xiong_directional_wd1e-1"
  variable: "temp"
  target: "mswt"
  src: "era5"
  model_type: "cnn10"
  interpolation_type: "linear"
  variables: ["z", "q", "t", "u", "v"]
  levels: [500, 700, 850, 1000]
  resolution: 2.0

training:
  learning_rate: 5e-4
  epochs: 150
  batch_size: 64
  loss_type: "xiong_directional"
  norm_mode: "gridbox"
  xiong:
    continuity_weight: 1.0e-4
    directional_weight: 1.0e-1
    eps: 1.0e-8
  early_stopping:
    enable: true
    max: 20
  gradient_clipping:
    enable: true
    value: 1.0
  weight_decay:
    enable: true
    value: 1e-4
  optimizer: "adam"
  dropout:
    enable: true
    value: 0.1
  scheduler:
    enable: true
    type: "cosine"
  group_norm:
    enable: true
    num_groups: 32
  validation:
    enable: true
    percentage: 0.1

cnn:
  mode: "cnn10"

region:
  lon_min: -18
  lon_max: 0
  lat_min: 21
  lat_max: 36

dates:
  train:
    start: "1979-01-01"
    end: "2005-12-31"
  test:
    start: "2006-01-01"
    end: "2014-12-31"

paths:
  # Paths for Mohammad's environment
  root_dir: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/reanalysis/era5"
  results_dir: "/srv/data/mohammad.elaabaribao/work/interns/y2026/temp/ds_temp_intern/temp/era5_mswt/main/results/phy_ai/cnn10_xiong_directional_wd1e-1"
  shapefile_path: "/home/mohammad.elaabaribao/lustre/climat-um6p-st-iwri-7ksifkvwkuy/users/mohammad.elaabaribao/data/shapefiles/Morocco_shpfile/DA_REGIONS_12R.shp"
  era5_predictor_pattern: "{var}_1979-2020_levels.nc"
